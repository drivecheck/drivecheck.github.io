[project]
name = "drivecheck-crawler"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "tenacity>=9.0",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "Pillow>=10.0",
  "argon2-cffi>=23.0",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
drivecheck-crawler = "drivecheck_crawler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
